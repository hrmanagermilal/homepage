services:
  # ── CMS PHP/Apache application ────────────────────────────────────────
  cms:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: milal-cms
    ports:
      - "${CMS_PORT:?Set CMS_PORT in .env}:80"
    environment:
      DB_HOST: milal-db          # backend's MySQL container on milal-net
      DB_PORT: ${DB_PORT:?}
      DB_NAME: ${DB_NAME:?}
      DB_USER: ${DB_USER:?}
      DB_PASS: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      APP_BASE_URL: "${APP_BASE_URL:-}"
    volumes:
      - .:/var/www/html                                            # live source mount
      - uploads_data:/var/www/html/public/uploads                 # user uploads (overlays above)
      - ../frontend/public/uploads:/var/www/html/public/images:ro
    restart: unless-stopped
    networks:
      milal-net:
        aliases:
          - milal-cms

volumes:
  uploads_data:
    external: true
    name: milal_uploads_data

networks:
  milal-net:
    external: true               # created by the backend docker-compose stack
