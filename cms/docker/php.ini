; ── File uploads ─────────────────────────────────────────────────────────────
upload_max_filesize = 20M
post_max_size       = 75M
max_file_uploads    = 20

; ── Execution limits ─────────────────────────────────────────────────────────
max_execution_time  = 60
max_input_time      = 60
memory_limit        = 256M

; ── Session (stored in /tmp inside the container) ────────────────────────────
session.save_path   = /tmp

; ── Error display (set to Off for production) ────────────────────────────────
display_errors      = Off
log_errors          = On
error_log           = /var/log/apache2/php-error.log

; ── Timezone ─────────────────────────────────────────────────────────────────
date.timezone       = America/Toronto
