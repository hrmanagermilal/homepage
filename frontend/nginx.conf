# Map /uploads/* → /images/* so the baked-static fallback works for both
# old images (files at /images/) and new images (files at /uploads/).
map $uri $images_legacy_path {
    ~^/uploads/(.*)$  /images/$1;
    default           $uri;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy /api requests to the backend container.
    # Used when VITE_API_BASE_URL is empty (relative paths).
    # On the same EC2 host the backend nginx listens on host port 8080.
    # Override by setting BACKEND_URL in the docker-compose environment and
    # rebuilding, or by pointing VITE_API_BASE_URL to the full backend URL
    # at build time instead.
    # Use Docker's internal DNS resolver and a variable so nginx defers
    # upstream hostname resolution to request time (avoids startup failure
    # when milal-nginx is not yet up).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend "milal-nginx";

    location /api/ {
        proxy_pass         http://$backend:80;
        proxy_http_version 1.1;
        proxy_set_header   Host              localhost;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # /uploads/: Docker volume (backend-uploaded files) first,
    # then fall back to baked-in static assets in the html root.
    # ^~ prevents the regex cache rule below from intercepting these requests.
    location ^~ /uploads/ {
        root /app;
        try_files $uri @baked_uploads;
        expires 7d;
        add_header Cache-Control "public";
    }

    location @baked_uploads {
        root /usr/share/nginx/html;
        # Try /uploads/ path first (new build), then /images/ path (old build).
        try_files $uri $images_legacy_path =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    # /images/ is an alias for /uploads/ (backward compatibility).
    location ^~ /images/ {
        rewrite ^/images/(.*)$ /uploads/$1 last;
    }

    # SPA fallback — all unmatched paths serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-term cache for hashed static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
