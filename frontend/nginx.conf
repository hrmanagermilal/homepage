# Map /uploads/* → /images/* so the baked-static fallback works for both
# old images (files at /images/) and new images (files at /uploads/).
map $uri $images_legacy_path {
    ~^/uploads/(.*)$  /images/$1;
    default           $uri;
}

server {
    listen 80;
    server_name milalchurch.ca *.milalchurch.ca milalchurch.com *.milalchurch.com;
    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend "milal-nginx";

    location /api/ {
        proxy_pass         http://$backend:80;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location ^~ /uploads/ {
        root /app;
        try_files $uri @baked_uploads_http;
        expires 7d;
        add_header Cache-Control "public";
    }

    location @baked_uploads_http {
        root /usr/share/nginx/html;
        try_files $uri $images_legacy_path =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    location ^~ /images/ {
        rewrite ^/images/(.*)$ /uploads/$1 last;
    }

    # Support certbot ACME challenges for Let's Encrypt
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name milalchurch.ca *.milalchurch.ca milalchurch.com *.milalchurch.com;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate /etc/nginx/certs/live/milalchurch.ca/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/milalchurch.ca/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Proxy /api requests to the backend container.
    # Used when VITE_API_BASE_URL is empty (relative paths).
    # On the same Docker network the backend nginx is reachable as milal-nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend "milal-nginx";

    location /api/ {
        proxy_pass         http://$backend:80;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # /uploads/: Docker volume (backend-uploaded files) first,
    # then fall back to baked-in static assets in the html root.
    # ^~ prevents the regex cache rule below from intercepting these requests.
    location ^~ /uploads/ {
        root /app;
        try_files $uri @baked_uploads;
        expires 7d;
        add_header Cache-Control "public";
    }

    location @baked_uploads {
        root /usr/share/nginx/html;
        # Try /uploads/ path first (new build), then /images/ path (old build).
        try_files $uri $images_legacy_path =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    # /images/ is an alias for /uploads/ (backward compatibility).
    location ^~ /images/ {
        rewrite ^/images/(.*)$ /uploads/$1 last;
    }

    # Support certbot ACME challenges for Let's Encrypt
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # SPA fallback — all unmatched paths serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-term cache for hashed static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
