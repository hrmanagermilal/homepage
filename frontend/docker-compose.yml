version: "3.8"

services:
  frontend:
    container_name: milal-frontend
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: ""
      VITE_API_PROXY_TARGET: "http://host.docker.internal"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
      - /app/node_modules
    restart: unless-stopped
