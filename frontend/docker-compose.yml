version: "3.8"

services:
  frontend:
    container_name: milal-frontend
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Leave empty to proxy /api through nginx to host port 8080 (backend).
        # Set to the full backend URL (e.g. https://api.milalchurch.com) to
        # call the backend directly from the browser (requires CORS to allow
        # the frontend origin on the backend).
        VITE_API_BASE_URL: ""
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - uploads_data:/app/uploads
      - ./certs:/etc/nginx/certs:ro
    networks:
      - milal-net
    restart: unless-stopped

volumes:
  uploads_data:
    external: true
    name: milal_uploads_data

networks:
  milal-net:
    external: true
