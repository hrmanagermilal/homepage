# HTTP — redirect all to HTTPS (for production domain)
server {
    listen 80;
    server_name api.milalchurch.com;

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTP — Development on localhost (no redirect)
server {
    listen 80 default_server;
    server_name localhost 127.0.0.1 _;

    client_max_body_size 12M;

    # Health check (handled by FastAPI, but also answerable here)
    location /health {
        access_log off;
        proxy_pass http://app:8000;
    }

    # Proxy all requests to FastAPI/uvicorn
    location / {
        proxy_pass         http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# Port 81 — milalCMS (PHP/Apache)
server {
    listen 81;
    server_name localhost 127.0.0.1 _;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $cms_upstream "milal-cms";

    client_max_body_size 25M;

    location / {
        proxy_pass         http://$cms_upstream:80;
        proxy_http_version 1.1;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# HTTPS
server {
    listen 443 ssl;
    http2 on;
    server_name api.milalchurch.com;
    
    root /var/www/html/public;
    index index.php index.html index.htm;

    # SSL certificates (self-signed for development)
    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # OCSP stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    client_max_body_size 12M;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Gzip compression
    gzip on;
    gzip_types application/json text/plain text/css application/javascript;
    gzip_min_length 256;

    # Health check
    location /health {
        access_log off;
        proxy_pass http://app:8000;
    }

    # Proxy all requests to FastAPI/uvicorn
    location / {
        proxy_pass         http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# Port 8090 — Uploads static file server
server {
    listen 8090;
    server_name localhost 127.0.0.1 _;

    root /var/www/uploads;

    # Only serve from /uploads/ path
    location /uploads/ {
        alias /var/www/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, OPTIONS";
        add_header Access-Control-Allow-Headers "Origin, Content-Type";

        # Disable directory listing
        autoindex off;

        # Block hidden files
        location ~ /\. { deny all; }
    }

    # Reject all other paths
    location / {
        return 404;
    }
}
