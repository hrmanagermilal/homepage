services:
  nginx:
    image: nginx:1.25-alpine
    container_name: milal-nginx
    ports:
      - "${NGINX_HTTP_PORT:?}:80"
      - "${NGINX_HTTPS_PORT:?}:443"
      - "${NGINX_CMS_PORT:?}:81"
      - "${NGINX_PORT_82:?}:82"
      - "${NGINX_PORT_83:?}:83"
      - "${NGINX_PORT_93:?}:93"
      - "${NGINX_PORT_8090:?}:8090"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # Mount frontend's certbot-managed certs directly so renewals
      # (which only run against frontend) apply here too without copying.
      - ../frontend/certs:/etc/nginx/certs:ro
      - uploads_data:/var/www/uploads:ro
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - milal-net
      - milal-shared

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: milal-backend
    expose:
      - "8000"
    environment:
      DB_HOST: db
      DB_PORT: ${DB_PORT:?}
      DB_NAME: ${DB_NAME:?}
      DB_USER: ${DB_USER:?}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRY: ${JWT_EXPIRY:-604800}
      CORS_ORIGIN: "${CORS_ORIGIN:?}"
      UPLOADS_PATH: /app/uploads
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - milal-net

  db:
    image: mysql:8.0
    container_name: milal-db
    ports:
      - "127.0.0.1:${DB_HOST_PORT:?}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${DB_NAME:?}
      MYSQL_USER: ${DB_USER:?}
      MYSQL_PASSWORD: ${DB_PASSWORD:?}
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    volumes:
      - db_data:/var/lib/mysql
      - ./sql/create_tables.sql:/docker-entrypoint-initdb.d/01-create_tables.sql
      - ./sql/insert_test_data.sql:/docker-entrypoint-initdb.d/02-insert_test_data.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - milal-net

volumes:
  db_data:
  uploads_data:
    name: milal_uploads_data

networks:
  milal-net:
    name: milal-net
    driver: bridge
  milal-shared:
    external: true
